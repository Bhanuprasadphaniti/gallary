
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Using Loop</title>

    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        h1 {
            font-size: 35px;
            color: orange;
        }

        img {
            max-width: 90vw;
            max-height: 60vh;
            width: auto;
            height: auto;

            object-fit: contain;
            border: 4px solid white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
        }

        button {
            background-color: orange;
            color: black;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <img id="img" src="i1.jpg" alt="Gallery Image">

    <div class="controls">
        <button onclick="backward()">&#10094; Prev</button>
        <button onclick="forward()">Next &#10095;</button>
    </div>

    <script>
        let img = document.getElementById("img");

        let totalImages = 5;
        let index = 1;

        function forward() {
            index++;

            if (index > totalImages) {
                index = 1;
            }

            img.setAttribute("src", "i" + index + ".jpg");
        }

        function backward() {
            index--;

            if (index < 1) {
                index = totalImages;
            }

            img.setAttribute("src", "i" + index + ".jpg");
        }
    </script>

</body>
</html>
